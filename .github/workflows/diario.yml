name: Atualizar Pixel Diário

on:
  schedule:
    - cron: "0 23 * * *"   # 23h UTC = 20h em Brasília
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar edição
        run: python atualizar.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Publicar
        run: |
          git config user.name "pixel-diario-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "Edição de $(date -u +%F)" && git push)
